name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare desktop bundle
        shell: pwsh
        run: ./scripts/prepare_desktop_bundle.ps1

      - name: Validate desktop scripts and startup smoke (fast gate)
        shell: pwsh
        run: ./scripts/validate_desktop_scripts.ps1

      - name: Installed layout startup smoke (Unicode path)
        shell: pwsh
        run: |
          $unicodeRoot = Join-Path $env:TEMP "huoke-smoke-unicode-盈小蚁"
          ./scripts/verify_installed_startup.ps1 -RepoRoot (Get-Location) -InstallRoot $unicodeRoot -BackendPort 18767

      - name: Build Windows NSIS installer
        shell: pwsh
        run: ./scripts/build_native_win.ps1

      - name: Installed NSIS startup smoke (powershell.exe)
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer exe not found"
          }
          ./scripts/verify_nsis_installed.ps1 -InstallerPath $installer.FullName -BackendPort 18768

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: huoke-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
