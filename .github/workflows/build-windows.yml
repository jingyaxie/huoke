name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows NSIS installer
        shell: pwsh
        run: ./scripts/build_native_win.ps1

      - name: Verify portable Python bundle
        shell: pwsh
        run: |
          $py = @(
            "desktop/bundle/runtime/python/python.exe",
            "desktop/bundle/runtime/python/bin/python.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $py) {
            throw "Missing portable Python runtime under desktop/bundle/runtime/python"
          }
          $env:PYTHONPATH = (Resolve-Path "desktop/bundle/backend").Path
          & $py -c "import uvicorn; from app.main import app; print('bundle verify ok')"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: huoke-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
