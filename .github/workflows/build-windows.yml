name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python
        shell: pwsh
        run: |
          python --version
          Write-Host "pythonLocation=$env:pythonLocation"

      - name: Pin Python for bundling
        shell: pwsh
        run: |
          $py = (Get-Command python -ErrorAction Stop).Source
          if ($py -match 'WindowsApps\\python(\.exe)?$') {
            throw "Resolved Windows Store python stub instead of setup-python: $py"
          }
          "PYTHON=$py" >> $env:GITHUB_ENV
          "HUOKE_PYTHON=$py" >> $env:GITHUB_ENV
          Write-Host "Pinned PYTHON=$py"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows NSIS installer
        shell: pwsh
        run: ./scripts/build_native_win.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: huoke-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
