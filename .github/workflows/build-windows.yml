name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows NSIS installer
        shell: pwsh
        run: ./scripts/build_native_win.ps1

      - name: Verify portable Python bundle
        shell: pwsh
        run: |
          $py = @(
            "desktop/bundle/runtime/python/python.exe",
            "desktop/bundle/runtime/python/bin/python.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $py) {
            throw "Missing portable Python runtime under desktop/bundle/runtime/python"
          }
          $env:PYTHONPATH = (Resolve-Path "desktop/bundle/backend").Path
          & $py -c "import uvicorn; from app.main import app; print('bundle verify ok')"

          if (-not (Test-Path "scripts/_python_win.ps1")) {
            throw "Missing scripts/_python_win.ps1 (required by desktop-run-backend.ps1)"
          }
          $config = Get-Content "desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if (-not $config.bundle.resources.'../../scripts/_python_win.ps1') {
            throw "_python_win.ps1 not listed in tauri.conf.json bundle.resources"
          }

          if (-not $config.bundle.resources.'../../scripts/desktop-bundle-cache.ps1') {
            throw "desktop-bundle-cache.ps1 not listed in tauri.conf.json bundle.resources"
          }

          $pwBrowsers = "desktop/bundle/runtime/playwright-browsers"
          if (-not (Test-Path $pwBrowsers)) {
            throw "Missing bundled Playwright browsers: $pwBrowsers"
          }
          $env:PLAYWRIGHT_BROWSERS_PATH = (Resolve-Path $pwBrowsers).Path
          & $py (Resolve-Path "scripts/verify_playwright_bundle.py").Path
          if ($LASTEXITCODE -ne 0) { throw "playwright chromium launch verify failed" }
          Write-Host "Bundled Playwright browsers verified under $pwBrowsers"

      - name: Installed layout startup smoke (ASCII + Unicode)
        shell: pwsh
        run: |
          $asciiRoot = Join-Path $env:TEMP "huoke-smoke-ascii"
          $unicodeRoot = Join-Path $env:TEMP "huoke-smoke-unicode-盈小蚁"
          ./scripts/verify_installed_startup.ps1 -RepoRoot (Get-Location) -InstallRoot $asciiRoot -BackendPort 18766
          ./scripts/verify_installed_startup.ps1 -RepoRoot (Get-Location) -InstallRoot $unicodeRoot -BackendPort 18767

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: huoke-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
