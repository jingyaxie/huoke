name: Build macOS Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build macOS DMG
        run: ./scripts/build_native_mac.sh

      - name: Verify portable Python bundle
        run: |
          py="$(find desktop/bundle/runtime/python -type f \( -name 'python3.12' -o -name 'python3' \) | head -n1)"
          if [[ -z "$py" ]]; then
            echo "Missing portable Python runtime under desktop/bundle/runtime/python" >&2
            exit 1
          fi
          PYTHONPATH="$(pwd)/desktop/bundle/backend" "$py" -c "import uvicorn; from app.main import app; print('bundle verify ok')"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: huoke-macos-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: huoke-macos-app
          path: desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
